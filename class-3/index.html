<style>
  :root{
    --bg:#FBF9F2; --page:#FFFEFA; --ink:#1F1F1D; --ink-soft:#46453F; --ink-dim:#7D7669;
    --rule:#E1DBC9; --gold:#B4A67F; --gold-deep:#AC9D71; --gold-line:#BFB18F; --ref:#72ABBF;
    --seg-hl:rgba(180,166,127,.16); --word-hl:rgba(180,166,127,.38); --highlight-text:#1F1F1D; --spoken:#BFB18F;
    --serif:"Crimson Pro",Georgia,serif; --display:"Cormorant Infant","Crimson Pro",serif;
    --sans:"Assistant",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink-soft);
    font-family:var(--serif);
    min-height:100vh;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;}
  .bar{position:sticky;top:0;z-index:6;background:var(--gold);color:#fff;font-family:var(--sans);
    display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;box-shadow:0 1px 0 rgba(0,0,0,.06);}
  .bar a,.bar button{color:#fff;background:none;border:none;padding:0;margin:0;cursor:pointer;font:inherit;
    -webkit-tap-highlight-color:transparent;text-decoration:none;}
  .barBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;}
  .barBtn:active{background:rgba(255,255,255,.18);}
  .barBtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .barBtn.hidden{visibility:hidden;}
  #barCenter{min-width:0;width:100%;text-align:center;line-height:1.2;padding:4px 2px;border-radius:8px;}
  #barCenter:active{background:rgba(255,255,255,.12);}
  #barClass{display:block;font-weight:600;font-size:.98rem;letter-spacing:.03em;}
  #barChapter{display:block;font-weight:400;font-size:.78rem;opacity:.92;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #barChapter:empty{display:none;}
  .wrap{max-width:720px;margin:0 auto;padding:8px 24px 120px;}
  header{padding:28px 0 22px;text-align:center;border-bottom:1px solid var(--rule);margin-bottom:36px;}
  header h1{font-family:var(--display);font-weight:600;font-size:clamp(1.28rem,5.6vw,1.7rem);
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink);}
  main p{font-family:var(--serif);font-size:1.32rem;line-height:1.72;margin:0 0 1.3rem;text-align:left;color:var(--ink-soft);}
  .seg{border-radius:3px;transition:background-color .2s ease;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .seg.active{background:var(--seg-hl);box-shadow:0 0 0 3px var(--seg-hl);}
  .word{transition:background-color .12s ease,color .12s ease;border-radius:3px;padding:0 1px;cursor:pointer;}
  .word.spoken{color:var(--spoken);}
  .word.current{background:var(--word-hl);color:var(--highlight-text);box-shadow:0 0 0 2px var(--word-hl);}
  .word:hover{background:var(--word-hl);color:var(--ink);}

  #chaptersOverlay{position:fixed;inset:0;background:rgba(31,31,29,.42);display:none;z-index:20;}
  #chaptersOverlay.open{display:block;}
  #chaptersSheet{position:absolute;left:0;right:0;bottom:0;max-height:72vh;background:var(--page);
    border-radius:18px 18px 0 0;padding:0 0 calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(31,31,29,.25);overflow:hidden;}
  .sheetHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    background:var(--gold);color:#fff;font-family:var(--sans);font-size:.8rem;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;}
  .sheetHeader button{background:none;border:none;font-size:22px;line-height:1;color:#fff;cursor:pointer;}
  #chaptersList{list-style:none;margin:0;padding:4px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #chaptersList li a{display:flex;align-items:baseline;gap:14px;padding:14px 18px;text-decoration:none;
    color:var(--ink-soft);border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:1rem;line-height:1.4;}
  #chaptersList li a:active{background:var(--bg);}
  #chaptersList li a.active{color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--gold-deep);}
  #chaptersList li a.active .chapTime{color:var(--gold-deep);}
  #chaptersList .chapTime{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--ref);min-width:42px;flex:0 0 auto;}

  #player{position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(255,254,250,.75), var(--page) 22%);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--rule);padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(31,31,29,0.10);
    transition:transform .32s ease;}
  #player.collapsed{transform:translateY(100%);box-shadow:none;}
  #player .inner{max-width:720px;margin:0 auto;}
  #progressStrip{position:fixed;left:0;right:0;bottom:0;z-index:9;pointer-events:none;
    height:calc(3px + env(safe-area-inset-bottom));background:var(--rule);
    opacity:0;transition:opacity .3s ease;}
  #progressStrip.show{opacity:1;}
  #progressFill{height:3px;width:0;background:var(--gold-deep);transition:width .25s linear;}
  .seekRow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  #curTime,#durTime{font-family:var(--sans);font-size:.75rem;color:var(--ink-dim);min-width:38px;flex:0 0 auto;}
  #durTime{text-align:right;}
  #seek{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--rule);outline:none;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--gold-deep);cursor:pointer;box-shadow:0 1px 4px rgba(31,31,29,.35);border:2px solid var(--page);}
  #seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold-deep);cursor:pointer;border:2px solid var(--page);}
  .controlsRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;}
  .controlsRow .transport{grid-column:2;display:flex;align-items:center;justify-content:center;gap:28px;}
  .controlsRow .speedSlot{grid-column:3;display:flex;justify-content:flex-end;}
  .ctrlBtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;}
  .ctrlBtn svg{width:26px;height:26px;fill:var(--ink-soft);}
  #playBtn{width:64px;height:64px;border-radius:50%;background:var(--gold-deep);box-shadow:0 3px 10px rgba(172,157,113,.45);}
  #playBtn svg{width:26px;height:26px;fill:#fff;margin-left:2px;}
  #playBtn.playing svg{margin-left:0;}
  #playBtn:active{transform:scale(.96);}
  .skipLabel{position:absolute;font-size:10px;font-family:var(--sans);font-weight:600;letter-spacing:.01em;line-height:1;color:var(--gold-deep);top:50%;left:50%;transform:translate(-50%,-50%);}
  .skipBtn{position:relative;}
  .skipBtn svg.arc{width:34px;height:34px;fill:none;stroke:var(--ink-soft);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  #speed{font-family:var(--sans);font-size:.7rem;color:var(--ink-dim);background:var(--page);border:1px solid var(--rule);border-radius:14px;padding:4px 8px;}
  #dropzone{font-size:.75rem;font-family:var(--sans);color:var(--ink-dim);text-align:center;margin-top:10px;display:none;}
  #dropzone button{font-family:var(--sans);font-size:.75rem;color:var(--gold-deep);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;}

  #resumeBtn{position:fixed;left:50%;bottom:calc(148px + env(safe-area-inset-bottom));z-index:15;
    display:flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:.85rem;color:#fff;
    background:var(--gold-deep);border:none;border-radius:20px;padding:10px 18px;cursor:pointer;
    box-shadow:0 4px 16px rgba(31,31,29,.28);
    opacity:0;pointer-events:none;transform:translate(-50%,8px);
    transition:opacity .25s ease,transform .25s ease;}
  #resumeBtn.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
  #resumeBtn.low{bottom:calc(28px + env(safe-area-inset-bottom));}
  #resumeBtn svg{width:14px;height:14px;fill:#fff;flex:0 0 auto;}
</style>
</head>

<script>

    if(u.origin !== location.origin) return;
    e.preventDefault();

}
const segments = JSON.parse(document.getElementById('transcriptData').textContent);

    if(file){ audio.src = URL.createObjectURL(file); dropzone.style.display = 'none'; }
  };
  input.click();
});

const flatWords = [];
let currentP = null;
segments.forEach(seg => {
  if(!currentP || seg.newpara){ currentP = document.createElement('p'); textEl.appendChild(currentP); }
  // Each transcript segment (roughly a sentence) gets its own wrapper so the
  // sentence being read can carry a soft wash under the stronger word mark.
  const segEl = document.createElement('span');
  segEl.className = 'seg';
  seg.words.forEach(w => {
    const span = document.createElement('span');
    span.className = 'word'; span.textContent = w.t;
    span.dataset.start = w.s; span.dataset.end = w.e;
    segEl.appendChild(span);
    segEl.appendChild(document.createTextNode(' '));
    flatWords.push({ start: w.s, end: w.e, el: span, seg: segEl });
  });
  currentP.appendChild(segEl);
});

let activeSeg = null;
function setActiveSeg(segEl){
  if(segEl === activeSeg) return;
  if(activeSeg) activeSeg.classList.remove('active');
  activeSeg = segEl || null;
  if(activeSeg) activeSeg.classList.add('active');
}

function fmt(sec){ if(!isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0'); }

function binarySearchWord(t){
  let lo=0, hi=flatWords.length-1, ans=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1;
    if(flatWords[mid].start<=t){ ans=mid; lo=mid+1; } else hi=mid-1; }
  return ans;
}
// Scrolling to follow the current word is done through this helper so we
// can tell our own programmatic scrolls apart from the reader manually
// scrolling around the page (see the window 'scroll' listener below).
let programmaticScroll = false;
let programmaticScrollTimer = null;
function scrollWordIntoView(el, behavior){
  programmaticScroll = true;
  el.scrollIntoView({block:'center', behavior: behavior || 'smooth'});
  clearTimeout(programmaticScrollTimer);
  programmaticScrollTimer = setTimeout(() => { programmaticScroll = false; }, 700);
}

function updateHighlight(){
  // Called on every 'timeupdate' during normal playback. Word timestamps
  // from the ASR aren't always perfectly monotonic (tiny overlaps/jitter
  // at paragraph boundaries), so this only ever moves forward — a
  // same-or-earlier index is treated as jitter and ignored. Real
  // backward moves (seeking, chapter jumps, word clicks) go through
  // syncSpokenState() instead, which recomputes everything from scratch.
  const t = audio.currentTime; const idx = binarySearchWord(t);
  if(idx < 0) return;
  // A real backward move we didn't initiate (lock-screen scrubbing, a seek
  // the browser applied late): recompute everything.
  if(idx < lastIdx - 2){ syncSpokenState(false); return; }
  if(idx <= lastIdx){
    // Jitter — but make sure the mark is still where it should be.
    if(!flatWords[lastIdx].el.classList.contains('current')) syncSpokenState(false);
    return;
  }
  for(let i = Math.max(lastIdx, 0); i < idx; i++){
    flatWords[i].el.classList.remove('current'); flatWords[i].el.classList.add('spoken');
  }
  flatWords[idx].el.classList.remove('spoken'); flatWords[idx].el.classList.add('current');
  setActiveSeg(flatWords[idx].seg);
  if(!autoFollowSuspended) scrollWordIntoView(flatWords[idx].el);
  lastIdx = idx;
}
// scrollBehavior: falsy = don't scroll, true/'smooth' = animate, 'auto' = jump instantly.
// Used for deliberate navigation (word/chapter clicks, skip buttons, seeking,
// resuming saved progress) — always clears the "reader scrolled away" state.
function syncSpokenState(scrollBehavior){
  const t = audio.currentTime; const idx = binarySearchWord(t);
  flatWords.forEach((w,i) => { w.el.classList.remove('current','spoken');
    if(i<idx) w.el.classList.add('spoken'); if(i===idx) w.el.classList.add('current'); });
  setActiveSeg(idx>=0 ? flatWords[idx].seg : null);
  lastIdx = idx;
  updateChapter();
  autoFollowSuspended = false;
  hideResumeBtn();
  if(scrollBehavior && idx>=0){
    scrollWordIntoView(flatWords[idx].el, scrollBehavior === true ? 'smooth' : scrollBehavior);
  }
}

// If the reader manually scrolls away from the current word (to look ahead,
// re-read something, etc.) we stop auto-following so we don't fight them,
// and show a small pill to jump back — which itself fades if left alone.
let autoFollowSuspended = false;
let resumeHideTimer = null;
function showResumeBtn(){
  resumeBtn.classList.add('show');
  clearTimeout(resumeHideTimer);
  resumeHideTimer = setTimeout(() => resumeBtn.classList.remove('show'), 4000);
}
function hideResumeBtn(){
  resumeBtn.classList.remove('show');
  clearTimeout(resumeHideTimer);
}
window.addEventListener('scroll', () => {
  if(programmaticScroll || lastIdx < 0) return;
  autoFollowSuspended = true;
  showResumeBtn();
}, {passive:true});
resumeBtn.addEventListener('click', () => {
  autoFollowSuspended = false;
  hideResumeBtn();
  if(lastIdx >= 0) scrollWordIntoView(flatWords[lastIdx].el);
});

const chapterRows = [];

function chapterIndexAt(t){
  let i = CHAPTERS.length ? 0 : -1;
  for(let k = 0; k < CHAPTERS.length; k++){ if(CHAPTERS[k].t <= t) i = k; else break; }

}
function updateChapter(){
  const i = chapterIndexAt(audio.currentTime);
  if(i === curChapter) return;
  curChapter = i;

  chapterRows.forEach((r, k) => r.classList.toggle('active', k === i));
}

  if(act) act.scrollIntoView({block:'center'});
}

document.addEventListener('click', e => {
  if(e.target.closest('#player, #chaptersOverlay, #resumeBtn, header, .bar, a, button, select')) return;
  if(e.target.classList.contains('word')) return;
  if(player.classList.contains('collapsed')) expandPlayer();
  else { clearTimeout(collapseTimer); setCollapsed(true); }
});
document.addEventListener('keydown', e => {
  if(e.code !== 'Space' || e.target.closest('select, input, button')) return;
  e.preventDefault();
  if(audio.paused) audio.play(); else audio.pause();
});

let seekDragging = false;
audio.addEventListener('timeupdate', () => {
  updateHighlight();
  if(!seekDragging){ seek.value = Math.floor(audio.currentTime*10); curTime.textContent = fmt(audio.currentTime); }
  if(audio.duration) progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  updateChapter();
});
// ---- Listening progress ----
// The saved position is restored as soon as the browser will honour a seek
// (iOS often ignores one made before playback starts), and nothing is
// written back until that restore has actually taken — or the reader has
// deliberately moved somewhere else — so an early save can never wipe out
// real progress with a near-zero position.
const PROGRESS_KEY = 'bota-tol-progress-class-3';
const DURATION_KEY = 'bota-tol-duration-class-3';
const DONE_KEY = 'bota-tol-done-class-3';
try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
let resumeTarget = null;      // position still to be restored
let progressArmed = false;    // saves allowed
let resumeTries = 0;
try {
  const saved = parseFloat(localStorage.getItem(PROGRESS_KEY));
  if(!isNaN(saved) && saved > 3) resumeTarget = saved;
} catch(e){}
if(resumeTarget === null) progressArmed = true;
else { curTime.textContent = fmt(resumeTarget); }

function saveProgress(force){
  if(!progressArmed && !force) return;
  const t = audio.currentTime;
  if(!isFinite(t)) return;
  try {
    const prev = parseFloat(localStorage.getItem(PROGRESS_KEY));
    if(!force && t < 5 && prev >= 10) return;  // don't clobber real progress with a stray zero
    localStorage.setItem(PROGRESS_KEY, String(t));
  } catch(e){}
}
function settleResume(){
  resumeTarget = null; progressArmed = true;
}
function applyResume(){
  if(resumeTarget === null) return;
  if(audio.duration && resumeTarget >= audio.duration - 2){ settleResume(); return; }
  if(Math.abs(audio.currentTime - resumeTarget) < 1.5){ settleResume(); return; }
  if(resumeTries++ > 6) { settleResume(); return; }
  try { audio.currentTime = resumeTarget; } catch(e){}
  seek.value = Math.floor(resumeTarget*10); curTime.textContent = fmt(resumeTarget);
  syncSpokenState('auto');
}
// The reader chose a position themselves: that wins over any pending restore.
function userNavigated(){
  settleResume();
  saveProgress(true);
}
audio.addEventListener('loadedmetadata', () => {
  seek.max = Math.floor(audio.duration*10); durTime.textContent = fmt(audio.duration);
  try { localStorage.setItem(DURATION_KEY, String(audio.duration)); } catch(e){}
  applyResume();
});
audio.addEventListener('canplay', applyResume);
audio.addEventListener('play', applyResume);
audio.addEventListener('seeked', () => {
  if(resumeTarget !== null && Math.abs(audio.currentTime - resumeTarget) < 1.5) settleResume();
  syncSpokenState(false);
  saveProgress();
});
let lastSaveAt = 0;
audio.addEventListener('timeupdate', () => {
  if(resumeTarget !== null){
    if(Math.abs(audio.currentTime - resumeTarget) < 1.5) settleResume();
    else if(audio.currentTime < 2 && !audio.paused) applyResume();
  }
  const now = Date.now();
  if(now - lastSaveAt > 3000){ lastSaveAt = now; saveProgress(); }
});
audio.addEventListener('ended', () => {
  try { localStorage.setItem(DONE_KEY, '1'); } catch(e){}
  saveProgress(true);
});
audio.addEventListener('pause', () => saveProgress());
document.addEventListener('visibilitychange', () => { if(document.hidden) saveProgress(); });
window.addEventListener('pagehide', () => saveProgress());
window.addEventListener('beforeunload', () => saveProgress());
audio.addEventListener('error', () => { dropzone.style.display = 'block'; });
audio.addEventListener('play', () => { playBtn.classList.add('playing');
  playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  scheduleCollapse(); });
audio.addEventListener('pause', () => { playBtn.classList.remove('playing');
  playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  clearTimeout(collapseTimer); setCollapsed(false); });

playBtn.addEventListener('click', () => { if(audio.paused) audio.play(); else audio.pause(); });
document.getElementById('back15').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime-15); syncSpokenState(true); userNavigated(); });
document.getElementById('fwd15').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration, audio.currentTime+15); syncSpokenState(true); userNavigated(); });

seek.addEventListener('mousedown', () => seekDragging = true);
seek.addEventListener('touchstart', () => seekDragging = true);
seek.addEventListener('input', () => { curTime.textContent = fmt(seek.value/10); });
seek.addEventListener('change', () => { audio.currentTime = seek.value/10; seekDragging = false; syncSpokenState(true); userNavigated(); });

speedEl.addEventListener('change', () => { audio.playbackRate = parseFloat(speedEl.value); });

textEl.addEventListener('click', e => {
  if(e.target.classList.contains('word')){
    audio.currentTime = parseFloat(e.target.dataset.start);
    syncSpokenState(false);
    userNavigated();
    if(audio.paused) audio.play();
  }
});
</script>
</body>
</html>
