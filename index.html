<style>
  :root{
    --bg:#FBF9F2; --page:#FFFEFA; --ink:#1F1F1D; --ink-soft:#46453F; --ink-dim:#7D7669;
    --rule:#E1DBC9; --gold:#B4A67F; --gold-deep:#AC9D71;
    --serif:"Crimson Pro",Georgia,serif; --display:"Cormorant Infant","Crimson Pro",serif;
    --sans:"Assistant",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink-soft);
    font-family:var(--serif);
    min-height:100vh;padding:0 0 60px;}
  .bar{position:sticky;top:0;z-index:5;background:var(--gold);color:#fff;font-family:var(--sans);
    font-weight:500;font-size:1.05rem;text-align:center;letter-spacing:.02em;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;}
  .wrap{max-width:560px;margin:0 auto;padding:8px 24px 0;}
  header{text-align:center;padding:28px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:8px;}
  header h1{font-family:var(--display);font-weight:600;font-size:clamp(1.28rem,5.6vw,1.7rem);
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink);}
  .summary{font-family:var(--sans);font-size:.8rem;color:var(--ink-dim);letter-spacing:.02em;margin:10px 0 0;}
  .summary:empty{display:none;}
  ul{list-style:none;margin:0;padding:0;}
  li a{position:relative;display:flex;align-items:center;gap:14px;
    padding:19px 4px;border-bottom:1px solid var(--rule);
    text-decoration:none;color:var(--ink-soft);font-family:var(--sans);font-size:1.05rem;}
  li a:active{background:var(--page);}
  .num{color:var(--gold-deep);font-family:var(--sans);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-right:auto;}
  .meta{font-size:.78rem;color:var(--ink-dim);font-weight:500;letter-spacing:.02em;white-space:nowrap;}
  .meta:empty{display:none;}
  .meta.done{color:var(--gold-deep);}
  .meta svg{width:13px;height:13px;stroke:var(--gold-deep);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px;}
  .arrow{color:var(--ink-dim);}
  .prog{position:absolute;left:4px;right:4px;bottom:-1px;height:2px;pointer-events:none;}
  .prog i{display:block;height:100%;width:0;background:var(--gold-deep);}
</style>

<div class="bar">B.O.T.A.</div>
<div class="wrap">

<script>
// Home-screen app: keep same-site links inside the app (iOS otherwise
// hands anything it considers out of scope to an in-app Safari view).
if(navigator.standalone){
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if(!a || a.target === '_blank') return;
    const u = new URL(a.getAttribute('href'), location.href);
    if(u.origin !== location.origin) return;
    e.preventDefault();
    location.href = u.href;
  }, true);
}
(function(){
  let done = 0, total = 0;
  document.querySelectorAll('li a[data-class]').forEach(a => {
    total++;
    const n = a.dataset.class, meta = a.querySelector('.meta'), fill = a.querySelector('.prog i');
    let pos = 0, dur = parseFloat(a.dataset.dur) || 0, fin = false;
    try {
      pos = parseFloat(localStorage.getItem('bota-tol-progress-class-' + n)) || 0;
      dur = parseFloat(localStorage.getItem('bota-tol-duration-class-' + n)) || dur;
      fin = localStorage.getItem('bota-tol-done-class-' + n) === '1';
    } catch(e){}
    const pct = dur ? Math.min(100, pos / dur * 100) : 0;
    if(fin || pct >= 97){
      done++;
      meta.className = 'meta done';
      meta.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Finished';
      fill.style.width = '100%';
    } else if(pct >= 1){
      meta.textContent = Math.round(pct) + '%';
      fill.style.width = pct + '%';
    }
  });
  const s = document.getElementById('summary');
  if(done) s.textContent = done + ' of ' + total + ' finished';
})();
</script>
